<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Dashboard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px;
        background: #f7f7f8;
        color: #222;
      }
      .post {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 12px;
      }
      .post h2 {
        font-size: 1.05rem;
        margin: 0 0 6px;
      }
      .error {
        color: #b00020;
      }
      input {
        width: 100%;
        padding: 8px;
        font-size: 1rem;
        box-sizing: border-box;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
